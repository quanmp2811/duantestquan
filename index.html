<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">Hệ thống quản lý bán hàng</div>
        <div class="brand-subtitle">Dashboard và tài liệu vận hành</div>
      </div>
      <div class="tabs" data-active-tab="dashboard">
        <div class="tab-slider"></div>
        <button class="tab-button active" type="button" data-tab="dashboard">Dashboard</button>
        <button class="tab-button" type="button" data-tab="report">Report</button>
      </div>
    </header>

    <main class="main-shell">
      <section class="view-panel active" id="dashboardView">
        <div class="frame-wrap">
          <iframe class="content-frame" id="dashboardFrame" title="Dashboard" referrerpolicy="no-referrer"></iframe>
        </div>
      </section>

      <section class="report-layout" id="reportView">
        <aside class="report-sidebar" id="reportSidebar">
          <div class="sidebar-toolbar">
            <div class="sidebar-actions">
              <button class="sidebar-toggle is-close" id="sidebarToggle" type="button" aria-label="Đóng thanh bên" aria-expanded="true" aria-controls="reportSidebar">
                <span class="sidebar-toggle-icon" aria-hidden="true"></span>
              </button>
            </div>
            <label class="search-box" for="searchInput">
              <input id="searchInput" type="search" placeholder="Tìm tài liệu hoặc bảng dữ liệu">
            </label>
            <div class="report-status" id="reportStatus"></div>
          </div>
          <div class="tree-root" id="treeRoot"></div>
        </aside>

        <section class="report-content">
          <div class="preview-shell">
            <div class="preview-header">
              <div class="content-toggle-wrap is-hidden" id="contentToggleWrap">
                <button class="sidebar-toggle is-open" id="contentSidebarToggle" type="button" aria-label="Mở thanh bên" aria-expanded="false" aria-controls="reportSidebar">
                  <span class="sidebar-toggle-icon" aria-hidden="true"></span>
                </button>
              </div>
              <h2 id="previewTitle">Danh sách tài liệu</h2>
              <p id="previewNote"></p>
            </div>

            <div class="report-placeholder" id="reportPlaceholder">
              <div class="placeholder-card">
                <div class="placeholder-icon">▦</div>
                <h2>Chọn tài liệu để xem</h2>
                <p>Danh sách bên trái hỗ trợ tìm kiếm nhanh và mở trực tiếp trong khung xem trước.</p>
              </div>
            </div>

            <iframe class="report-preview-frame" id="reportPreviewFrame" title="Report preview" referrerpolicy="no-referrer"></iframe>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./script.js"></script>
</body>
</html>
